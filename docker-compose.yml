services:
  db:
    image: postgres:16-alpine
    container_name: autogest_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autogest_db}
      POSTGRES_USER: ${POSTGRES_USER:-autogest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autogest_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autogest_user} -d ${POSTGRES_DB:-autogest_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autogest_backend
    restart: unless-stopped
    environment:
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-django-insecure-autogest-taller-sergio-2026-secret-key}
      POSTGRES_DB: ${POSTGRES_DB:-autogest_db}
      POSTGRES_USER: ${POSTGRES_USER:-autogest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autogest_pass_2026}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations users core &&
             python manage.py migrate &&
             python manage.py seed_sprint1 &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autogest_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "http://localhost:8000/api"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
